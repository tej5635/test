<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barcode Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        #scanner {
            width: 100%;
            max-width: 700px;
            height: 400px;

            margin: 20px auto;

            position: relative;
            overflow: hidden;

            background: #000;

            border: 3px solid #333;
            border-radius: 10px;
        }

        #scanner video {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /*
            Red scanning box
        */
        .scan-box {
            position: absolute;

            top: 30%;
            left: 5%;

            width: 90%;
            height: 40%;

            border: 3px solid red;

            pointer-events: none;
        }

        /*
            Red scanning line
        */
        .scan-line {
            position: absolute;

            top: 50%;
            left: 0;

            width: 100%;
            height: 2px;

            background: red;
        }

        button {
            padding: 12px 25px;

            margin: 5px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #status {
            margin-top: 15px;

            font-size: 18px;
        }

        #result {
            margin: 20px auto;

            max-width: 500px;

            padding: 20px;

            background: white;

            border-radius: 8px;

            font-size: 35px;
            font-weight: bold;

            min-height: 80px;
        }
    </style>
</head>

<body>

    <h1>Barcode Scanner</h1>

    <button id="startBtn">
        Start Scanner
    </button>

    <button id="stopBtn">
        Stop Scanner
    </button>


    <div id="scanner">

        <div class="scan-box">
            <div class="scan-line"></div>
        </div>

    </div>


    <div id="status">
        Scanner stopped
    </div>


    <div id="result">
        ---
    </div>


    <!-- Quagga2 -->
    <script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.js"></script>


    <script>

        let scanning = false;

        const resultElement =
            document.getElementById("result");

        const statusElement =
            document.getElementById("status");

        const startButton =
            document.getElementById("startBtn");

        const stopButton =
            document.getElementById("stopBtn");


        /*
        =====================================================
            START SCANNER
        =====================================================
        */

        function startScanner() {

            /*
                Don't start twice
            */

            if (scanning) {
                return;
            }

            resultElement.innerText = "---";

            statusElement.innerText =
                "Starting camera...";


            /*
            =================================================
                Quagga configuration
            =================================================
            */

            Quagga.init({

                inputStream: {

                    name: "Live",

                    type: "LiveStream",

                    target:
                        document.querySelector("#scanner"),

                    constraints: {

                        width: 640,

                        height: 480,

                        facingMode: "environment"

                    },

                    /*
                        Better camera area
                    */

                    area: {
                        top: "20%",
                        right: "5%",
                        left: "5%",
                        bottom: "20%"
                    }

                },


                locator: {

                    patchSize: "medium",

                    halfSample: false

                },


                /*
                    Your barcode is Code 128
                */

                decoder: {

                    readers: [
                        "code_128_reader"
                    ],

                    multiple: false

                },


                locate: true,

                numOfWorkers: 0,

                frequency: 10,

                debug: false

            }, function(error) {

                if (error) {

                    console.error(
                        "Quagga error:",
                        error
                    );

                    statusElement.innerText =
                        "Camera error: " +
                        error.message;

                    scanning = false;

                    return;
                }


                console.log(
                    "Scanner started"
                );

                statusElement.innerText =
                    "Scanning... Put barcode inside red box";


                Quagga.start();

                scanning = true;

            });

        }


        /*
        =====================================================
            BARCODE DETECTED
        =====================================================
        */

        function barcodeDetected(result) {

            if (!result) {
                return;
            }


            if (!result.codeResult) {
                return;
            }


            const code =
                result.codeResult.code;


            if (!code) {
                return;
            }


            console.log(
                "Detected barcode:",
                code
            );


            /*
                Show ONLY barcode value
            */

            resultElement.innerText = code;


            statusElement.innerText =
                "Barcode detected";


            /*
                Stop scanner
            */

            stopScanner();

        }


        /*
        =====================================================
            STOP SCANNER
        =====================================================
        */

        function stopScanner() {

            if (!scanning) {
                return;
            }


            try {

                Quagga.stop();

            } catch (error) {

                console.log(
                    "Stop error:",
                    error
                );

            }


            scanning = false;


            statusElement.innerText =
                "Scanner stopped";

        }


        /*
        =====================================================
            IMPORTANT
            Register event ONLY ONCE
        =====================================================
        */

        Quagga.onDetected(
            barcodeDetected
        );


        /*
        =====================================================
            BUTTON EVENTS
        =====================================================
        */

        startButton.addEventListener(
            "click",
            startScanner
        );


        stopButton.addEventListener(
            "click",
            stopScanner
        );

    </script>

</body>
</html>
