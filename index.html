<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Barcode Scanner</title>

  <!-- Quagga2 -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    #scanner {
      position: relative;

      width: 100%;
      max-width: 700px;

      height: 450px;

      margin: auto;

      background: black;

      overflow: hidden;

      border-radius: 10px;
    }

    /*
      Quagga creates a video/canvas inside
      this element.
    */

    #scanner video,
    #scanner canvas {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /*
      Red scanning area
    */

    #scanBox {

      position: absolute;

      z-index: 10;

      top: 30%;

      left: 5%;

      width: 90%;

      height: 40%;

      border: 3px solid red;

      pointer-events: none;

    }

    /*
      Moving scan line
    */

    #scanLine {

      position: absolute;

      left: 0;

      width: 100%;

      height: 2px;

      background: red;

      animation: scan 2s linear infinite;

    }

    @keyframes scan {

      0% {
        top: 0;
      }

      100% {
        top: 100%;
      }

    }

    .buttons {
      margin-top: 20px;
    }

    button {

      padding: 12px 25px;

      margin: 5px;

      border: none;

      border-radius: 6px;

      font-size: 16px;

      cursor: pointer;

    }

    #startBtn {
      background: #198754;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #status {

      margin-top: 15px;

      font-size: 16px;

      font-weight: bold;

    }

    #result {

      margin: 20px auto;

      width: 100%;

      max-width: 700px;

      min-height: 80px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 36px;

      font-weight: bold;

      letter-spacing: 2px;

    }

  </style>

</head>

<body>

  <h2>Barcode Scanner</h2>


  <!-- Scanner -->

  <div id="scanner">

    <div id="scanBox">

      <div id="scanLine"></div>

    </div>

  </div>


  <!-- Buttons -->

  <div class="buttons">

    <button id="startBtn">
      Start Scanner
    </button>

    <button id="stopBtn">
      Stop Scanner
    </button>

  </div>


  <!-- Status -->

  <div id="status">
    Click Start Scanner
  </div>


  <!-- Result -->

  <div id="result">
    ---
  </div>


  <script>

    let scanning = false;


    const scannerElement =
      document.getElementById("scanner");


    const startBtn =
      document.getElementById("startBtn");


    const stopBtn =
      document.getElementById("stopBtn");


    const status =
      document.getElementById("status");


    const result =
      document.getElementById("result");



    // ==========================================
    // START SCANNER
    // ==========================================

    function startScanner() {

      if (scanning) {
        return;
      }

      scanning = true;


      result.innerText = "---";

      status.innerText =
        "Starting camera...";


      Quagga.init(

        {

          inputStream: {

            name: "Live",

            type: "LiveStream",

            target: scannerElement,


            constraints: {

              width: {
                min: 640,
                ideal: 1280,
                max: 1920
              },

              height: {
                min: 480,
                ideal: 720,
                max: 1080
              },

              facingMode: {
                ideal: "environment"
              },

              aspectRatio: {
                min: 1,
                max: 2
              }

            },


            /*
              Scan only the center area.

              This helps prevent Quagga
              from reading other text.
            */

            area: {

              top: "30%",

              right: "5%",

              left: "5%",

              bottom: "30%"

            }

          },


          locator: {

            patchSize: "medium",

            halfSample: false

          },


          numOfWorkers:
            navigator.hardwareConcurrency
              ? Math.min(
                  navigator.hardwareConcurrency,
                  4
                )
              : 2,


          frequency: 10,


          decoder: {

            /*
              IMPORTANT:
              We are NOT using only Code 128.

              We try several common
              1D barcode formats.
            */

            readers: [

              "code_128_reader",

              "code_39_reader",

              "code_93_reader",

              "codabar_reader",

              "ean_reader",

              "ean_8_reader",

              "upc_reader",

              "upc_e_reader",

              "i2of5_reader"

            ]

          },


          locate: true

        },


        function(error) {

          if (error) {

            console.error(
              "Quagga initialization error:",
              error
            );


            scanning = false;


            status.innerText =
              "Camera error: " +
              error.message;


            return;

          }


          console.log(
            "Quagga initialized"
          );


          Quagga.start();


          status.innerText =
            "Scanning... Put ONE barcode inside the red box";

        }

      );

    }



    // ==========================================
    // BARCODE DETECTED
    // ==========================================

    function onDetected(data) {

      if (!scanning) {
        return;
      }


      console.log(
        "RAW RESULT:",
        data
      );


      if (
        !data ||
        !data.codeResult
      ) {
        return;
      }


      const code =
        data.codeResult.code;


      if (!code) {
        return;
      }


      console.log(
        "DETECTED:",
        code
      );


      /*
        Remove spaces.

        Example:

        "FD 1626"

        becomes:

        "FD1626"
      */

      const cleanCode =
        code
          .toString()
          .trim()
          .replace(/\s+/g, "");


      /*
        Ignore very short values.
      */

      if (cleanCode.length < 4) {
        return;
      }


      /*
        Your values are alphanumeric.

        Examples:

        FD1626
        DFS656
        DS6516
        1ZQK7C
      */

      const isValid =
        /^[A-Z0-9]+$/i.test(
          cleanCode
        );


      if (!isValid) {
        return;
      }


      /*
        SHOW ONLY THE VALUE
      */

      result.innerText =
        cleanCode;


      status.innerText =
        "Barcode detected";


      /*
        Stop after successful scan
      */

      stopScanner();

    }



    // ==========================================
    // REGISTER DETECTION ONCE
    // ==========================================

    Quagga.onDetected(
      onDetected
    );



    // ==========================================
    // STOP SCANNER
    // ==========================================

    function stopScanner() {

      if (!scanning) {
        return;
      }


      scanning = false;


      try {

        Quagga.stop();

      } catch (error) {

        console.log(
          "Stop error:",
          error
        );

      }


      /*
        Stop camera tracks too.
      */

      const video =
        scannerElement.querySelector(
          "video"
        );


      if (
        video &&
        video.srcObject
      ) {

        video.srcObject
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      status.innerText =
        "Scanner stopped";

    }



    // ==========================================
    // BUTTON EVENTS
    // ==========================================

    startBtn.addEventListener(
      "click",
      startScanner
    );


    stopBtn.addEventListener(
      "click",
      stopScanner
    );


  </script>

</body>
</html>
