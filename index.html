<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barcode Scanner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }

        #scanner {
            width: 100%;
            max-width: 700px;
            height: 400px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            background: black;
            border: 3px solid #333;
            border-radius: 10px;
        }

        #scanner video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-box {
            position: absolute;
            left: 5%;
            top: 30%;
            width: 90%;
            height: 40%;
            border: 3px solid red;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 2px;
            background: red;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            font-size: 17px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
        }

        #result {
            margin: 20px auto;
            max-width: 500px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            font-size: 35px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Barcode Scanner</h1>

    <button id="startBtn">
        Start Scanner
    </button>

    <button id="stopBtn">
        Stop Scanner
    </button>

    <div id="scanner">

        <div class="scan-box">
            <div class="scan-line"></div>
        </div>

    </div>

    <div id="status">
        Scanner stopped
    </div>

    <div id="result">
        ---
    </div>


    <!-- Quagga2 -->
    <script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.js"></script>


    <script>

        const resultElement =
            document.getElementById("result");

        const statusElement =
            document.getElementById("status");

        const startButton =
            document.getElementById("startBtn");

        const stopButton =
            document.getElementById("stopBtn");


        let scanning = false;


        /*
        =====================================================
            BARCODE -> REQUIRED NUMBER
        =====================================================
        */

        const barcodeMap = {

            "FAF": "FD1626",

            "FAK": "DFS656",

            "FA3": "DS6516"

        };


        /*
        =====================================================
            START SCANNER
        =====================================================
        */

        function startScanner() {

            if (scanning) {
                return;
            }

            resultElement.innerText = "---";

            statusElement.innerText =
                "Starting camera...";


            Quagga.init({

                inputStream: {

                    name: "Live",

                    type: "LiveStream",

                    target:
                        document.querySelector("#scanner"),

                    constraints: {

                        width: 640,

                        height: 480,

                        facingMode: "environment"

                    },

                    area: {

                        top: "20%",

                        right: "5%",

                        left: "5%",

                        bottom: "20%"

                    }

                },


                locator: {

                    patchSize: "small",

                    halfSample: false

                },


                decoder: {

                    /*
                        IMPORTANT:
                        Your barcode is Code 39
                    */

                    readers: [
                        "code_39_reader"
                    ],

                    multiple: false

                },


                locate: true,

                frequency: 10,

                debug: false

            }, function(error) {

                if (error) {

                    console.error(error);

                    statusElement.innerText =
                        "Camera error";

                    scanning = false;

                    return;
                }


                console.log(
                    "Scanner started"
                );


                statusElement.innerText =
                    "Scanning...";


                Quagga.start();

                scanning = true;

            });

        }


        /*
        =====================================================
            BARCODE DETECTED
        =====================================================
        */

        function handleDetected(result) {

            if (!result) {
                return;
            }


            if (!result.codeResult) {
                return;
            }


            const scannedCode =
                result.codeResult.code;


            if (!scannedCode) {
                return;
            }


            console.log(
                "Barcode detected:",
                scannedCode
            );


            /*
            =================================================
                Convert barcode value
            =================================================
            */

            const finalValue =
                barcodeMap[scannedCode];


            /*
                If barcode exists in our mapping,
                show required value.
            */

            if (finalValue) {

                console.log(
                    "Final value:",
                    finalValue
                );


                resultElement.innerText =
                    finalValue;


                statusElement.innerText =
                    "Barcode detected";


                stopScanner();

            } else {

                /*
                    Useful for testing unknown barcodes.
                */

                console.log(
                    "Unknown barcode:",
                    scannedCode
                );

            }

        }


        /*
        =====================================================
            REGISTER EVENT ONLY ONCE
        =====================================================
        */

        Quagga.onDetected(
            handleDetected
        );


        /*
        =====================================================
            STOP SCANNER
        =====================================================
        */

        function stopScanner() {

            if (!scanning) {
                return;
            }

            try {

                Quagga.stop();

            } catch (error) {

                console.log(error);

            }

            scanning = false;

            statusElement.innerText =
                "Scanner stopped";

        }


        /*
        =====================================================
            BUTTONS
        =====================================================
        */

        startButton.addEventListener(
            "click",
            startScanner
        );


        stopButton.addEventListener(
            "click",
            stopScanner
        );

    </script>

</body>
</html>
