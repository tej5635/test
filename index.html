<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Barcode Scanner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        #scanner {
            position: relative;

            width: 100%;
            max-width: 700px;

            height: 450px;

            margin: 20px auto;

            overflow: hidden;

            background: #000;

            border-radius: 12px;
        }

        #video {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* Red scanning box */

        .scan-box {
            position: absolute;

            top: 30%;
            left: 5%;

            width: 90%;
            height: 40%;

            border: 3px solid red;

            pointer-events: none;
        }

        /* Red scanning line */

        .scan-line {
            position: absolute;

            top: 50%;
            left: 0;

            width: 100%;
            height: 3px;

            background: red;
        }

        button {
            padding: 13px 25px;

            margin: 5px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #status {
            margin-top: 15px;

            font-size: 18px;
        }

        #result {
            width: 100%;
            max-width: 500px;

            min-height: 80px;

            margin: 20px auto;

            padding: 20px;

            background: white;

            border-radius: 10px;

            font-size: 35px;

            font-weight: bold;

            word-break: break-all;
        }

    </style>

</head>


<body>


    <h1>Barcode Scanner</h1>


    <div id="scanner">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>


        <div class="scan-box">

            <div class="scan-line"></div>

        </div>

    </div>


    <button id="startBtn">
        Start Camera
    </button>


    <button id="stopBtn">
        Stop Camera
    </button>


    <div id="status">
        Camera stopped
    </div>


    <div id="result">
        ---
    </div>



    <!--
        ZXing Browser
    -->
    <script src="https://unpkg.com/@zxing/browser@latest"></script>


    <script>

        /*
        ====================================================
            VARIABLES
        ====================================================
        */

        let codeReader = null;

        let controls = null;

        let scanning = false;


        const video =
            document.getElementById("video");


        const result =
            document.getElementById("result");


        const status =
            document.getElementById("status");


        const startBtn =
            document.getElementById("startBtn");


        const stopBtn =
            document.getElementById("stopBtn");



        /*
        ====================================================
            START SCANNER
        ====================================================
        */

        async function startScanner() {

            /*
                Prevent duplicate scanners
            */

            if (scanning) {

                return;

            }


            try {

                /*
                ============================================
                    Create ZXing reader
                ============================================
                */

                codeReader =
                    new ZXingBrowser.BrowserMultiFormatOneDReader();


                /*
                ============================================
                    Reset result
                ============================================
                */

                result.innerText = "---";


                status.innerText =
                    "Starting camera...";


                scanning = true;


                /*
                ============================================
                    Start camera + barcode scanning
                ============================================
                */

                controls =
                    await codeReader.decodeFromConstraints(

                        {

                            video: {

                                facingMode: {
                                    ideal: "environment"
                                },

                                width: {
                                    ideal: 1280
                                },

                                height: {
                                    ideal: 720
                                }

                            },

                            audio: false

                        },

                        video,

                        (scanResult, error) => {


                            /*
                            =================================
                                BARCODE FOUND
                            =================================
                            */

                            if (scanResult) {

                                const value =
                                    scanResult.getText();


                                console.log(
                                    "Barcode:",
                                    value
                                );


                                /*
                                =================================
                                    SHOW ONLY VALUE
                                =================================
                                */

                                result.innerText =
                                    value;


                                status.innerText =
                                    "Barcode detected";


                                /*
                                =================================
                                    STOP SCANNER
                                =================================
                                */

                                stopScanner();

                            }


                            /*
                            =================================
                                Ignore normal scan errors
                            =================================

                                ZXing continuously tries to
                                decode frames. Not finding a
                                barcode is normal.
                            */

                        }

                    );


                status.innerText =
                    "Scanning... Put barcode inside red box";


            } catch (error) {

                console.error(
                    "Scanner error:",
                    error
                );


                scanning = false;


                status.innerText =
                    "Scanner error: " +
                    error.message;

            }

        }



        /*
        ====================================================
            STOP SCANNER
        ====================================================
        */

        function stopScanner() {

            scanning = false;


            /*
            ================================================
                Stop ZXing
            ================================================
            */

            if (controls) {

                controls.stop();

                controls = null;

            }


            /*
            ================================================
                Stop camera tracks
            ================================================
            */

            if (video.srcObject) {

                const tracks =
                    video.srcObject.getTracks();


                tracks.forEach(
                    track => track.stop()
                );


                video.srcObject = null;

            }


            /*
            ================================================
                Keep result visible
            ================================================
            */

            if (
                result.innerText === "---"
            ) {

                status.innerText =
                    "Camera stopped";

            }

        }



        /*
        ====================================================
            BUTTON EVENTS
        ====================================================
        */

        startBtn.addEventListener(
            "click",
            startScanner
        );


        stopBtn.addEventListener(
            "click",
            stopScanner
        );


    </script>

</body>

</html>
