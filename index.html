<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --ink:#1c1f1a;
    --paper:#eef0e6;
    --line:#c9cdbd;
    --accent:#3f6b3f;
    --accent-deep:#274a27;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Courier New', ui-monospace, monospace;
    background:var(--ink);
    color:var(--paper);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 40px;
  }
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    font-size:1.4rem;
    letter-spacing:0.02em;
    margin:0 0 4px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:0.85rem;
    color:#9aa08c;
  }
  #scanner-container{
    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio:4/3;
    background:#000;
    border:2px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  #scanner-container video, #scanner-container canvas{
    width:100% !important;
    height:100% !important;
    object-fit:cover;
  }
  .frame-guide{
    position:absolute;
    top:50%;
    left:10%;
    right:10%;
    height:2px;
    background:var(--accent);
    box-shadow:0 0 6px var(--accent);
    animation:sweep 2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    0%,100%{ top:32%; }
    50%{ top:68%; }
  }
  .hint{
    position:absolute;
    bottom:10px;
    left:0; right:0;
    text-align:center;
    font-size:0.75rem;
    color:#cfd4c2;
    text-shadow:0 1px 2px #000;
  }
  #result-box{
    margin-top:22px;
    width:100%;
    max-width:480px;
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    padding:18px 20px;
    text-align:center;
  }
  #result-box .label{
    font-size:0.72rem;
    letter-spacing:0.08em;
    color:#5c6151;
  }
  #result{
    font-size:2rem;
    font-weight:700;
    margin-top:6px;
    min-height:2.4rem;
    word-break:break-all;
  }
  #result.placeholder{
    color:#9aa08c;
    font-weight:400;
    font-size:1.1rem;
  }
  #history{
    margin-top:20px;
    width:100%;
    max-width:480px;
  }
  #history h2{
    font-size:0.85rem;
    color:#9aa08c;
    font-weight:400;
    margin:0 0 8px;
  }
  #history ul{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:220px;
    overflow-y:auto;
  }
  #history li{
    display:flex;
    justify-content:space-between;
    background:#2a2e24;
    border:1px solid var(--line);
    border-radius:3px;
    padding:8px 12px;
    font-size:0.95rem;
  }
  #history li span.t{
    color:#7c8270;
    font-size:0.75rem;
  }
  button{
    margin-top:16px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:4px;
    font-family:inherit;
    font-size:0.9rem;
    cursor:pointer;
  }
  button:hover{ background:var(--accent-deep); }
  #status{
    margin-top:10px;
    font-size:0.75rem;
    color:#9aa08c;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>Barcode Scanner</h1>
  <p>Point the camera at a 1D barcode</p>
</header>

<div id="scanner-container">
  <div class="frame-guide"></div>
  <div class="hint">Hold steady, fill the frame</div>
</div>

<div id="result-box">
  <div class="label">LAST SCANNED CODE</div>
  <div id="result" class="placeholder">Waiting for scan…</div>
</div>

<div id="history">
  <h2>Scan history</h2>
  <ul id="history-list"></ul>
</div>

<button id="restart-btn">Restart camera</button>
<div id="status"></div>

<script>
  const resultEl = document.getElementById('result');
  const historyList = document.getElementById('history-list');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart-btn');

  let lastCode = null;
  let lastTime = 0;

  function addToHistory(code){
    const li = document.createElement('li');
    const time = new Date().toLocaleTimeString();
    li.innerHTML = '<span>' + code + '</span><span class="t">' + time + '</span>';
    historyList.prepend(li);
  }

  function showResult(code){
    const now = Date.now();
    // ignore duplicate re-reads of the same code within 2 seconds
    if (code === lastCode && now - lastTime < 2000) return;
    lastCode = code;
    lastTime = now;

    resultEl.textContent = code;
    resultEl.classList.remove('placeholder');
    addToHistory(code);

    if (navigator.vibrate) navigator.vibrate(80);
  }

  function startScanner(){
    statusEl.textContent = 'Starting camera…';
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.getElementById('scanner-container'),
        constraints: {
          facingMode: "environment",
          width: { min: 640 },
          height: { min: 480 }
        }
      },
      locator: {
        patchSize: "medium",
        halfSample: true
      },
      numOfWorkers: 2,
      frequency: 10,
      decoder: {
        readers: [
          "code_128_reader",
          "ean_reader",
          "code_39_reader",
          "codabar_reader"
        ]
      },
      locate: true
    }, function(err){
      if (err){
        statusEl.textContent = 'Camera error: ' + err.message + ' (check permissions)';
        console.error(err);
        return;
      }
      statusEl.textContent = 'Camera ready — scanning…';
      Quagga.start();
    });

    Quagga.onDetected(function(data){
      const code = data.codeResult.code;
      showResult(code);
    });
  }

  function stopScanner(){
    try { Quagga.stop(); } catch(e){}
  }

  restartBtn.addEventListener('click', function(){
    stopScanner();
    setTimeout(startScanner, 300);
  });

  window.addEventListener('load', startScanner);
</script>

</body>
</html>
