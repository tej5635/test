<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Barcode Scanner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        #scanner {
            position: relative;

            width: 100%;
            max-width: 700px;

            height: 450px;

            margin: 20px auto;

            overflow: hidden;

            background: #000;

            border-radius: 12px;
        }

        #video {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /*
        =========================================
        RED SCANNING BOX
        =========================================
        */

        .scan-box {
            position: absolute;

            left: 5%;
            right: 5%;

            top: 30%;

            height: 40%;

            border: 3px solid red;

            pointer-events: none;
        }

        /*
        =========================================
        SCAN LINE
        =========================================
        */

        .scan-line {
            position: absolute;

            left: 0;
            right: 0;

            top: 50%;

            height: 3px;

            background: red;
        }

        /*
        =========================================
        BUTTONS
        =========================================
        */

        button {
            padding: 13px 25px;

            margin: 5px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        /*
        =========================================
        STATUS
        =========================================
        */

        #status {
            margin-top: 15px;

            font-size: 18px;
        }

        /*
        =========================================
        RESULT
        =========================================
        */

        #result {
            width: 100%;
            max-width: 500px;

            min-height: 80px;

            margin: 20px auto;

            padding: 20px;

            background: white;

            border-radius: 10px;

            font-size: 35px;

            font-weight: bold;

            word-break: break-all;
        }

    </style>
</head>


<body>

    <h1>Barcode Scanner</h1>


    <div id="scanner">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>


        <div class="scan-box">

            <div class="scan-line"></div>

        </div>

    </div>


    <button id="startBtn">
        Start Camera
    </button>


    <button id="stopBtn">
        Stop Camera
    </button>


    <div id="status">
        Camera stopped
    </div>


    <div id="result">
        ---
    </div>


<script>

/*
====================================================
ELEMENTS
====================================================
*/

const video =
    document.getElementById("video");

const result =
    document.getElementById("result");

const status =
    document.getElementById("status");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");


/*
====================================================
VARIABLES
====================================================
*/

let stream = null;

let scanning = false;

let detector = null;

let lastDetected = "";

let detecting = false;


/*
====================================================
CHECK BARCODE DETECTOR
====================================================
*/

function checkBarcodeDetector() {

    if (!("BarcodeDetector" in window)) {

        status.innerText =
            "BarcodeDetector is not supported in this browser.";

        return false;
    }

    return true;
}


/*
====================================================
START CAMERA
====================================================
*/

async function startCamera() {

    if (scanning) {
        return;
    }


    /*
    -----------------------------------------------
    Check browser support
    -----------------------------------------------
    */

    if (!checkBarcodeDetector()) {

        return;
    }


    try {

        /*
        -------------------------------------------
        Create barcode detector
        -------------------------------------------
        */

        detector =
            new BarcodeDetector({

                formats: [

                    "code_128",

                    "code_39",

                    "code_93",

                    "codabar",

                    "ean_13",

                    "ean_8",

                    "itf",

                    "upc_a",

                    "upc_e"

                ]

            });


        /*
        -------------------------------------------
        Open camera
        -------------------------------------------
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        /*
        -------------------------------------------
        Put camera into video
        -------------------------------------------
        */

        video.srcObject = stream;


        await video.play();


        scanning = true;

        result.innerText = "---";

        status.innerText =
            "Scanning... Put barcode inside red box";


        /*
        -------------------------------------------
        Start detection
        -------------------------------------------
        */

        scanBarcode();


    } catch (error) {

        console.error(error);

        status.innerText =
            "Camera error: " + error.message;

    }

}


/*
====================================================
SCAN BARCODE
====================================================
*/

async function scanBarcode() {

    if (!scanning) {
        return;
    }


    /*
    -----------------------------------------------
    Don't run two detections simultaneously
    -----------------------------------------------
    */

    if (detecting) {

        requestAnimationFrame(
            scanBarcode
        );

        return;
    }


    detecting = true;


    try {

        /*
        -------------------------------------------
        Detect barcode from camera
        -------------------------------------------
        */

        const barcodes =
            await detector.detect(video);


        /*
        -------------------------------------------
        If barcode found
        -------------------------------------------
        */

        if (
            barcodes &&
            barcodes.length > 0
        ) {

            const barcode =
                barcodes[0];


            const value =
                barcode.rawValue;


            console.log(
                "Barcode detected:",
                value
            );


            if (value) {

                /*
                -----------------------------------
                Show ONLY barcode value
                -----------------------------------
                */

                result.innerText =
                    value;


                status.innerText =
                    "Barcode detected";


                lastDetected =
                    value;


                /*
                -----------------------------------
                Stop camera
                -----------------------------------
                */

                stopCamera();


                detecting = false;

                return;
            }

        }

    } catch (error) {

        console.log(
            "Detection error:",
            error
        );

    }


    detecting = false;


    /*
    -----------------------------------------------
    Continue scanning
    -----------------------------------------------
    */

    if (scanning) {

        requestAnimationFrame(
            scanBarcode
        );

    }

}


/*
====================================================
STOP CAMERA
====================================================
*/

function stopCamera() {

    scanning = false;

    detecting = false;


    if (stream) {

        stream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        stream = null;

    }


    video.srcObject = null;


    /*
        Don't change result here.
        We want to keep the detected value.
    */

    if (lastDetected) {

        status.innerText =
            "Barcode detected";

    } else {

        status.innerText =
            "Camera stopped";

    }

}


/*
====================================================
BUTTONS
====================================================
*/

startBtn.addEventListener(
    "click",
    startCamera
);


stopBtn.addEventListener(
    "click",
    stopCamera
);

</script>

</body>
</html>
