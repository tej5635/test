<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Barcode Number Scanner</title>

  <!-- Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-bottom: 15px;
    }

    #scanner {
      position: relative;
      width: 100%;
      max-width: 700px;
      height: 500px;
      margin: auto;
      background: #000;
      overflow: hidden;
      border-radius: 10px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Red scanning box */
    #scanBox {
      position: absolute;
      left: 5%;
      top: 25%;
      width: 90%;
      height: 50%;
      border: 3px solid red;
      pointer-events: none;
    }

    #scanLine {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: red;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% {
        top: 0;
      }

      100% {
        top: 100%;
      }
    }

    button {
      margin: 15px 5px;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    #startBtn {
      background: green;
      color: white;
    }

    #stopBtn {
      background: #d33;
      color: white;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }

    #result {
      margin: 20px auto;
      max-width: 700px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      font-size: 32px;
      font-weight: bold;
      color: #111;
      min-height: 70px;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h2>Scan Barcode</h2>

  <div id="scanner">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <div id="scanBox">
      <div id="scanLine"></div>
    </div>

  </div>

  <button id="startBtn">
    Start Scanner
  </button>

  <button id="stopBtn">
    Stop Scanner
  </button>

  <div id="status">
    Click Start Scanner
  </div>

  <div id="result">
    ---
  </div>

  <canvas id="canvas"></canvas>

  <script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    let stream = null;
    let scanning = false;
    let processing = false;


    // =========================================
    // START CAMERA
    // =========================================

    async function startScanner() {

      if (scanning) {
        return;
      }

      try {

        status.innerText = "Opening camera...";
        result.innerText = "---";

        stream = await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false

        });

        video.srcObject = stream;

        await video.play();

        scanning = true;

        status.innerText =
          "Scanning... Put one barcode inside the red box";

        scanLoop();

      } catch (error) {

        console.error(error);

        status.innerText =
          "Camera error: " + error.message;

      }

    }


    // =========================================
    // STOP CAMERA
    // =========================================

    function stopScanner() {

      scanning = false;

      if (stream) {

        stream.getTracks().forEach(track => {
          track.stop();
        });

        stream = null;
      }

      video.srcObject = null;

      status.innerText = "Scanner stopped";

    }


    // =========================================
    // SCAN LOOP
    // =========================================

    async function scanLoop() {

      if (!scanning) {
        return;
      }

      if (!processing) {

        processing = true;

        try {

          await readTextBelowBarcode();

        } catch (error) {

          console.error(error);

        }

        processing = false;

      }

      if (scanning) {

        setTimeout(() => {
          scanLoop();
        }, 1200);

      }

    }


    // =========================================
    // OCR
    // =========================================

    async function readTextBelowBarcode() {

      if (
        video.videoWidth === 0 ||
        video.videoHeight === 0
      ) {
        return;
      }


      /*
        Red box:

        left   = 5%
        top    = 25%
        width  = 90%
        height = 50%

        We only take the LOWER part
        because your required value is
        printed below the barcode.
      */


      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;


      const x = videoWidth * 0.05;

      const y =
        videoHeight * 0.25 +
        videoHeight * 0.50 * 0.55;

      const width =
        videoWidth * 0.90;

      const height =
        videoHeight * 0.50 * 0.45;


      canvas.width = width;
      canvas.height = height;


      const ctx = canvas.getContext("2d");


      // Draw only text below barcode
      ctx.drawImage(

        video,

        x,
        y,
        width,
        height,

        0,
        0,
        width,
        height

      );


      // Increase contrast
      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;


      for (let i = 0; i < data.length; i += 4) {

        const r = data[i];

        const g = data[i + 1];

        const b = data[i + 2];


        const gray =
          0.299 * r +
          0.587 * g +
          0.114 * b;


        const value =
          gray < 150 ? 0 : 255;


        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;

      }


      ctx.putImageData(
        imageData,
        0,
        0
      );


      status.innerText =
        "Reading number...";


      // =========================================
      // TESSERACT OCR
      // =========================================

      const resultOCR =
        await Tesseract.recognize(

          canvas,

          "eng",

          {
            logger: message => {

              if (
                message.status === "recognizing text"
              ) {

                const percent =
                  Math.round(
                    message.progress * 100
                  );

                status.innerText =
                  "Reading number... " +
                  percent +
                  "%";

              }

            }
          }

        );


      const text =
        resultOCR.data.text
          .toUpperCase()
          .replace(/\s/g, "");


      console.log(
        "OCR RESULT:",
        text
      );


      // =========================================
      // FIND BARCODE NUMBER
      // =========================================

      const matches =
        text.match(
          /[A-Z0-9]{4,10}/g
        );


      if (!matches) {

        status.innerText =
          "Scanning...";

        return;

      }


      /*
        Prefer values containing
        BOTH letters and numbers.

        Example:

        FD1626   ✅
        DFS656   ✅
        DS6516   ✅
        1ZQK7C   ✅
      */

      const validValues =
        matches.filter(value => {

          const hasLetter =
            /[A-Z]/.test(value);

          const hasNumber =
            /[0-9]/.test(value);

          return hasLetter && hasNumber;

        });


      if (validValues.length === 0) {

        status.innerText =
          "Scanning...";

        return;

      }


      // First matching value
      const barcodeNumber =
        validValues[0];


      console.log(
        "FOUND:",
        barcodeNumber
      );


      result.innerText =
        barcodeNumber;


      status.innerText =
        "Number detected";


      // Stop after finding number
      stopScanner();

    }


    // =========================================
    // BUTTONS
    // =========================================

    startBtn.addEventListener(
      "click",
      startScanner
    );

    stopBtn.addEventListener(
      "click",
      stopScanner
    );

  </script>

</body>
</html>
